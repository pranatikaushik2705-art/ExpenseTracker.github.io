{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - Expense Tracker</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script type="module" src="{% static 'js/firebase.js' %}"></script>

<style>
    body {
        margin: 0; padding: 0;
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top, #fdf2f8, #fbcfe8, #f9a8d4);
        height: 100vh; display: flex; justify-content: center; align-items: center;
        perspective: 1200px;
    }

    .container {
        width: 800px; height: 450px; display: flex; background: white;
        border-radius: 20px; overflow: hidden;
        box-shadow: 0 15px 35px rgba(190, 24, 93, 0.2);
        border: 1px solid #fbcfe8;
    }

    /* LEFT FORM */
    .left-box {
        width: 50%; padding: 40px; display: flex; flex-direction: column;
        justify-content: center; background: #fff;
    }

    .left-box h2 {
        text-align: center;
        color: #be185d;
        margin-bottom: 25px;
        font-size: 36px;
        font-family: 'Dancing Script', cursive;
    }

    .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    
    .input-group label {
        font-family: 'Times New Roman', Times, serif;
        font-size: 14px; color: #64748b; margin-bottom: 5px; font-weight: bold;
        padding-left: 10%;
    }

    input {
        width: 80%; padding: 12px; border-radius: 10px;
        border: 1px solid #f9a8d4; background: #fff5f8; color: #831843;
        font-size: 15px; align-self: center; outline: none; transition: 0.2s;
    }

    input:focus {
        border-color: #be185d;
        box-shadow: 0 0 8px rgba(190, 24, 93, 0.2);
        background: #fff;
    }

    button {
        width: 80%; background: #be185d;
        padding: 14px; border: none; border-radius: 10px; color: white;
        font-size: 16px; margin-top: 15px; cursor: pointer; align-self: center;
        font-weight: 600; transition: 0.3s;
        box-shadow: 0 6px 18px rgba(190, 24, 93, 0.3);
    }

    button:hover {
        background: #9d174d; transform: scale(1.02);
    }

    .footer-text {
        text-align: center; margin-top: 20px;
        font-family: 'Times New Roman', Times, serif;
        font-size: 15px; color: #64748b;
    }

    .footer-text a { color: #be185d; font-weight: bold; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }

    /* RIGHT BOX */
    .right-box {
        width: 50%;
        background: linear-gradient(135deg, #be185d 0%, #9d174d 100%);
        display: flex; flex-direction: column; justify-content: center;
        padding: 40px; color: white; text-align: center;
    }

    .right-box h1 {
        font-family: 'Dancing Script', cursive;
        font-size: 45px; margin-bottom: 15px;
    }

    .right-box p {
        font-family: 'Times New Roman', Times, serif;
        font-size: 18px; opacity: 0.9; line-height: 1.5;
    }
</style>

<script type="module">
    import { auth, sendPasswordResetEmail } 
    from "{% static 'js/firebase.js' %}";

    window.sendResetEmail = function () {
        const email = document.getElementById("email").value;

        if (!email.trim()) {
            alert("Please enter your registered email.");
            return;
        }

        sendPasswordResetEmail(auth, email)
            .then(() => {
                alert("Password reset link sent! Check your email inbox.");
            })
            .catch(err => {
                alert(err.message);
            });
    };
</script>

</head>

<body>

<div class="container">

    <!-- LEFT FORM -->
    <div class="left-box">
        <h2>Reset Password</h2>

        <div class="input-group">
            <label>Registered Email</label>
            <input type="email" id="email" placeholder="e.g. name@example.com">
        </div>

        <button onclick="sendResetEmail()">Send Reset Link</button>

        <p class="footer-text">Remembered your password? <a href="{% url 'login' %}">Login</a></p>
    </div>

    <!-- RIGHT INFO BOX -->
    <div class="right-box">
        <h1>Password Reset</h1>
        <p>Don't worry! Enter your email address and we’ll send a secure reset link so you can get back to tracking your finances.</p>
        <div style="font-size: 55px; margin-top: 25px; opacity: 0.8;">
            <i class="fa-solid fa-lock-open"></i>
        </div>
    </div>

</div>

</body>
</html>
