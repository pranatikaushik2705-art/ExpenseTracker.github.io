{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Expense Tracker</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script type="module" src="{% static 'js/firebase.js' %}"></script>

<script type="module">
import { auth, signInWithEmailAndPassword } from "{% static 'js/firebase.js' %}";

window.loginUser = async function() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password.");
        return;
    }

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = "{% url 'login' %}"; 
        form.style.display = 'none';

        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrfmiddlewaretoken';
        csrfInput.value = '{{ csrf_token }}';

        const emailInput = document.createElement('input');
        emailInput.name = 'email_from_firebase'; 
        emailInput.value = user.email;

        form.appendChild(csrfInput);
        form.appendChild(emailInput);
        document.body.appendChild(form);
        
        form.submit(); 

    } catch (error) {
        console.error("Firebase Error Code:", error.code);
        if (error.code === 'auth/invalid-credential') {
            alert("Email ya Password galat hai. Dobara check karein.");
        } else {
            alert("Firebase Error: " + error.message);
        }
    }
}
</script>

<style>
    body {
        margin: 0; padding: 0; 
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top, #fdf2f8, #fbcfe8, #f9a8d4);
        height: 100vh; display: flex; justify-content: center; align-items: center;
        perspective: 1200px;
    }

    .container {
        width: 850px; height: 520px; display: flex; background: white;
        border-radius: 20px; overflow: hidden; position: relative;
        box-shadow: 0 15px 35px rgba(190, 24, 93, 0.2);
        border: 1px solid #fbcfe8;
        transition: transform 0.4s ease;
    }

    .container:hover {
        transform: translateY(-5px);
    }

    /* LEFT BOX: Login Form */
    .left-box {
        width: 50%; padding: 40px; display: flex; flex-direction: column;
        justify-content: center; background: #fff;
    }

    .left-box h2 { 
        text-align: center; 
        color: #be185d; 
        margin-bottom: 25px; 
        font-size: 38px; 
        font-family: 'Dancing Script', cursive; 
    }

    .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    
    .input-group label {
        font-family: 'Times New Roman', Times, serif;
        font-size: 14px; color: #64748b; margin-bottom: 5px; font-weight: bold;
        padding-left: 10%;
    }

    input {
        width: 80%; padding: 12px; border-radius: 10px;
        border: 1px solid #f9a8d4; background: #fff5f8; color: #831843;
        font-size: 15px; align-self: center; outline: none; transition: 0.2s;
    }

    input:focus {
        border-color: #be185d; box-shadow: 0 0 8px rgba(190, 24, 93, 0.2);
        background: #fff;
    }

    button {
        width: 80%; background: #be185d;
        padding: 14px; border: none; border-radius: 10px; color: white;
        font-size: 16px; margin-top: 15px; cursor: pointer; align-self: center;
        font-weight: 600; transition: 0.3s;
        box-shadow: 0 5px 15px rgba(190, 24, 93, 0.3);
    }

    button:hover {
        background: #9d174d; transform: scale(1.02);
    }

    .links-section {
        display: flex; flex-direction: column; align-items: center;
        margin-top: 25px; gap: 10px;
        font-family: 'Times New Roman', Times, serif;
    }

    .links-section a { font-size: 15px; color: #be185d; text-decoration: none; font-weight: bold; }
    .links-section a:hover { text-decoration: underline; }

    .register-text { font-size: 14px; color: #64748b; margin: 0; }

    /* RIGHT BOX: Branding */
    .right-box {
        width: 50%; 
        background: linear-gradient(135deg, #be185d 0%, #9d174d 100%);
        display: flex; flex-direction: column; justify-content: center;
        padding: 40px; color: white; text-align: center;
    }

    .right-box h1 { 
        font-family: 'Dancing Script', cursive; 
        font-size: 45px; margin-bottom: 15px; 
    }
    
    .right-box p { 
        font-family: 'Times New Roman', Times, serif; 
        font-size: 19px; opacity: 0.9; line-height: 1.5;
    }
</style>

</head>
<body>

<div class="container">
    <div class="left-box">
        <h2>Welcome Back</h2>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="e.g. name@example.com">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="loginUser()">Login Account</button>

        <div class="links-section">
            <a href="{% url 'reset_password' %}">Forgot Password?</a>
            <p class="register-text">
                New here? <a href="{% url 'register' %}">Create Account</a>
            </p>
        </div>
    </div>

    <div class="right-box">
        <h1>ExpenseTracker</h1>
        <p>Your journey to financial freedom starts here. Secure, smart, and beautifully organized.</p>
        <div style="font-size: 50px; margin-top: 20px; opacity: 0.8;">
            <i class="fa-solid fa-piggy-bank"></i>
        </div>
    </div>
</div>

</body>
</html>
