{% extends 'expenses/base.html' %}
{% load static %}
{% block content %}

<!-- Fonts Integration -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ==== MAIN PAGE SETTINGS ==== */
.page-bg {
    min-height: 90vh;
    background: #fdf2f8; /* Soft Pink/Lavender Background */
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding-top: 30px;
    padding-bottom: 50px;
}

/* ==== CENTERED HEADING ==== */
.title-box {
    text-align: center;
    margin-bottom: 40px;
}

.title-box h2 {
    font-size: 40px;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    color: #000;
    display: inline-block;
    position: relative;
    padding-bottom: 10px;
}

.title-box h2::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 20%;
    width: 60%;
    height: 4px;
    background: linear-gradient(90deg, #be185d, #db2777);
    border-radius: 10px;
}

/* ==== SPLIT LAYOUT CONTAINER ==== */
.split-wrapper {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(190, 24, 93, 0.1); 
    border: 1px solid #fce7f3;
}

/* ==== LEFT SIDE: FORM ==== */
.form-container {
    flex: 1.2;
    padding: 50px;
    background: #ffffff;
}

/* ==== RIGHT SIDE: IMAGE ==== */
.image-container {
    flex: 0.8;
    background: linear-gradient(rgba(190, 24, 93, 0.1), rgba(190, 24, 93, 0.1)), url("{% static 'images/addexpense_image.jpg' %}");
    background-size: cover;
    background-position: center;
    min-height: 550px;
    display: block;
    border-left: 1px solid #fce7f3;
}

/* ==== FORM ELEMENTS ==== */
label {
    display: block;
    font-weight: 700;
    font-size: 12px;
    color: #be185d; /* Pink Labels */
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 25px;
    border: 2px solid #f3f4f6;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #fff;
    transition: all 0.3s ease;
    color: #000;
}

input:focus, select:focus, textarea:focus {
    border-color: #be185d;
    outline: none;
    box-shadow: 0 0 0 4px rgba(190, 24, 93, 0.05);
}

.input-group {
    display: flex;
    gap: 12px;
}

.currency-select { width: 35%; font-weight: 600; }
.amount-input { width: 65%; font-weight: 700; font-family: 'Outfit', sans-serif; }

/* AI Suggestion Styling */
#ai-suggestion-box {
    margin: -15px 0 20px 0;
    font-size: 12px;
    background: #fdf2f8;
    padding: 8px 15px;
    border-radius: 10px;
    display: inline-block;
}

#apply-suggestion {
    background: #be185d;
    border: none;
    color: #fff;
    padding: 3px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 700;
    margin-left: 5px;
    font-size: 11px;
}

/* Gold/Black Button */
button.btn-add {
    width: 100%;
    padding: 16px;
    background: #000; /* Black button for contrast */
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    transition: 0.4s;
    margin-top: 10px;
    letter-spacing: 1px;
}

button.btn-add:hover {
    background: #be185d; /* Becomes pink on hover */
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(190, 24, 93, 0.2);
}

/* Responsive */
@media (max-width: 992px) {
    .split-wrapper { flex-direction: column; margin: 0 15px; border-radius: 20px; }
    .image-container { display: none; }
    .form-container { padding: 30px; }
}
</style>

<div class="page-bg">
    <!-- 1. Top Center Heading -->
    <div class="title-box">
        <h2><i class="fa-solid fa-feather-pointed"></i> Add New Expense</h2>
    </div>

    <!-- 2. Split Wrapper -->
    <div class="split-wrapper">
        
        <!-- LEFT SIDE: FORM -->
        <div class="form-container">
            <form method="post" id="expenseForm">
                {% csrf_token %}

                <label>What did you spend on?</label>
                <textarea name="description" id="id_description" rows="2" placeholder="e.g. Lavender Latte at the cafe" required></textarea>

                <div id="ai-suggestion-box" style="display:none;">
                    <span style="color: #be185d; font-weight: 600;">✨ Smart Tag: </span>
                    <button type="button" id="apply-suggestion">
                        <span id="suggested-label"></span> (Apply)
                    </button>
                </div>

                <label>Category</label>
                <select name="category" id="id_category">
                    <option value="Others" selected>Others</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Grocery">Grocery</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                </select>

                <label>Amount</label>
                <div class="input-group">
                    <select name="currency" class="currency-select" required>
                        <option value="INR" selected>INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                    <input type="number" step="0.01" name="amount" class="amount-input" placeholder="0.00" required>
                </div>

                <label>Date</label>
                <input type="date" name="date" value="{% now 'Y-m-d' %}" required>

                <button type="submit" class="btn-add">
                    <i class="fa-solid fa-sparkles"></i> SAVE TO EXPENSES!
                </button>
            </form>
        </div>

        <!-- RIGHT SIDE: IMAGE -->
        <div class="image-container"></div>

    </div>
</div>

<script>
    const descInput = document.getElementById('id_description');
    const categorySelect = document.getElementById('id_category');
    const suggestionBox = document.getElementById('ai-suggestion-box');
    const suggestedLabel = document.getElementById('suggested-label');
    const applyBtn = document.getElementById('apply-suggestion');

    descInput.addEventListener('blur', function() {
        const text = this.value.trim();
        if (text.length > 2) {
            fetch(`/api/suggest-category/?description=${encodeURIComponent(text)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.suggestion && data.suggestion !== 'Others') {
                        suggestedLabel.innerText = data.suggestion;
                        suggestionBox.style.display = 'inline-block';
                        applyBtn.onclick = function() {
                            categorySelect.value = data.suggestion;
                            suggestionBox.style.display = 'none';
                        };
                    } else {
                        suggestionBox.style.display = 'none';
                    }
                })
                .catch(err => console.log("AI error:", err));
        }
    });
</script>

{% endblock %}
